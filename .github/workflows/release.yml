# Builds a GitHub release once, then publishes independently to Modrinth and CurseForge.
#
# Triggered by publishing a release on GitHub: its tag names the version, its body becomes the
# changelog on every platform, and the pre-release checkbox picks between a stable and a beta
# release.
#
# It also pushes MODRINTH.md over the project description, so the page always matches the
# release that was just published.
#
# The tag is the single source of truth for the version: it is handed to Gradle as `-Pversion`,
# which is what `processResources` expands into fabric.mod.json. `version` in gradle.properties
# is only the default a local build falls back on, so nothing has to be bumped before tagging.

name: release
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # A pre-release goes out as a beta everywhere; a tag saying alpha as an alpha.
      - name: resolve the release
        id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${TAG#v}"

          # Everything downstream - the jar name, fabric.mod.json, the Modrinth version number -
          # is built from this string, so a tag like "latest" has to stop here rather than ship a
          # jar named after it.
          case "$version" in
            [0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG does not carry a version number (expected something like v1.2.3)"; exit 1 ;;
          esac

          if [ "$PRERELEASE" = "true" ]; then
            case "$version" in
              *alpha*) type=alpha ;;
              *) type=beta ;;
            esac
          else
            type=stable
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "Releasing $version as $type"

      - name: build
        run: ./gradlew build exampleDatapack "-Pversion=${{ steps.release.outputs.version }}"

      - name: save release files
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            build/libs/cobblemon-trainers-${{ steps.release.outputs.version }}.jar
            build/dist/exemple_trainer_datapack.zip
          if-no-files-found: error

    outputs:
      version: ${{ steps.release.outputs.version }}
      type: ${{ steps.release.outputs.type }}

  modrinth:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew

      # The plugin silently switches to dry-run when the token is absent.
      - name: check Modrinth credentials
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: test -n "$MODRINTH_TOKEN" || { echo '::error::MODRINTH_TOKEN is empty'; exit 1; }

      - name: publish to modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          ./gradlew publishMods \
            "-Pversion=${{ needs.build.outputs.version }}" \
            "-Prelease_type=${{ needs.build.outputs.type }}"

      - name: update the modrinth description
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          project=$(sed -n 's/^modrinth_id=//p' gradle.properties)
          [ -n "$project" ] || { echo "::error::modrinth_id is missing from gradle.properties"; exit 1; }

          jq -Rs '{body: .}' MODRINTH.md > modrinth-body.json

          args=(
            -sS -o modrinth-response.txt -w '%{http_code}'
            -X PATCH "https://api.modrinth.com/v2/project/$project"
            -H "Authorization: $MODRINTH_TOKEN"
            -H 'Content-Type: application/json'
            -H 'User-Agent: matheo-1712/cobblemon-trainers (release workflow)'
            --data @modrinth-body.json
          )
          code=$(curl "${args[@]}")

          if [ "$code" != "204" ]; then
            echo "::error::Modrinth refused the description update (HTTP $code)"
            cat modrinth-response.txt
            exit 1
          fi

          echo "description updated from MODRINTH.md"

  curseforge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: build

      - name: publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CHANGELOG: ${{ github.event.release.body }}
          RELEASE_TYPE: ${{ needs.build.outputs.type }}
          VERSION: ${{ needs.build.outputs.version }}
        run: bash .github/scripts/publish-curseforge.sh

  github-assets:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: build

      - name: attach the assets to the github release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          jar="build/libs/cobblemon-trainers-${VERSION}.jar"
          pack="build/dist/exemple_trainer_datapack.zip"

          for asset in "$jar" "$pack"; do
            [ -f "$asset" ] || { echo "::error::$asset was not built"; exit 1; }
          done

          gh release upload "$TAG" "$jar" "$pack" --clobber
