# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.19.5
loom_version=1.17.20
kotlin_version=2.4.10
publish_plugin_version=2.2.0
mixin_version=0.17.4+mixin.0.8.7
fabric_kotlin_version=1.13.13+kotlin.2.4.10

# Mod Properties
# Version par défaut, utilisée par les builds locaux. Lors d'une release, c'est le tag qui
# fait foi : le workflow passe `-Pversion=<tag>` et c'est cette valeur qui part dans
# fabric.mod.json et sur Modrinth.
version=0.10.0
group=matheo1712.cobbletrainers

# Dependencies
fabric_api_version=0.116.17+1.21.1

# Cobblemon 1.8.1 - ID de version Modrinth
cobblemon_version=gBW3vLC7

# Jeu de dev uniquement (configuration `devMods`, copiée dans run/mods) : rien ne compile
# contre ces mods. Mega Showdown fournit les méga-gemmes, donc c'est la seule façon de tester
# `battle.gimmicks` ; `accessories` est une dépendance dure de Mega Showdown, `owo` une
# dépendance dure d'accessories, et `architectury` une dépendance dure de Mega Showdown elle
# aussi - Cobblemon 1.8 n'en a plus besoin, ni pour compiler ni pour tourner. Sans l'une
# d'elles, le loader s'arrête sur « Incompatible mods found! ».
mega_showdown_version=jkKKeTX2
accessories_version=Xlt4eWBe
owo_version=JB1fLQnc
architectury_version=Pzc2FP5K

# Publication
# ID du projet Modrinth (Settings > General, champ « Project ID »).
modrinth_id=khlinTrc
# Numeric CurseForge project ID (About Project on the project page).
curseforge_id=1655714
