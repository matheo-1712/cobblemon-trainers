# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.18.4
loom_version=1.17-SNAPSHOT
fabric_kotlin_version=1.13.13+kotlin.2.4.10

# Mod Properties
# Version par défaut, utilisée par les builds locaux. Lors d'une release, c'est le tag qui
# fait foi : le workflow passe `-Pversion=<tag>` et c'est cette valeur qui part dans
# fabric.mod.json et sur Modrinth/CurseForge.
version=0.1.0
group=matheo1712.cobbletrainers

# Dependencies
fabric_api_version=0.116.15+1.21.1

# Cobblemon 1.7.3 — ID de version Modrinth
cobblemon_version=kF7CvxTo
architectury_version=Pzc2FP5K

# Publication
# Une plateforme dont l'ID de projet est vide est retirée de `publishMods` : on peut publier
# sur l'une avant que l'autre existe.
# CurseForge veut son ID *numérique* (encadré « About Project » de la page du mod) ; le slug
# ne sert qu'à l'affichage.
modrinth_id=khlinTrc
curseforge_id=1655714
curseforge_slug=cobblemon-trainers
